name: compat-lab-nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-lab-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            lane: macos
            node-version: "24"
            artifact: compat-lab-nightly-macos-node24.json
          - os: macos-latest
            lane: macos
            node-version: "26"
            artifact: compat-lab-nightly-macos-node26.json
          - os: ubuntu-latest
            lane: linux
            node-version: "24"
            artifact: compat-lab-nightly-linux-node24.json
          - os: ubuntu-latest
            lane: linux
            node-version: "26"
            artifact: compat-lab-nightly-linux-node26.json
          - os: windows-latest
            lane: windows-prep
            node-version: "24"
            artifact: compat-lab-nightly-windows-prep-node24.json
          - os: windows-latest
            lane: windows-prep
            node-version: "26"
            artifact: compat-lab-nightly-windows-prep-node26.json
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run acceptance lane
        run: npm run test:acceptance -- --lane ${{ matrix.lane }} --report-out artifacts/${{ matrix.artifact }}

      - name: Upload nightly acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  nightly-release-readiness:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    runs-on: ubuntu-latest
    env:
      PAIRSLASH_RELEASE_TRUST_PRIVATE_KEY: ${{ secrets.PAIRSLASH_RELEASE_TRUST_PRIVATE_KEY }}
      PAIRSLASH_RELEASE_TRUST_KEY_ID: ${{ secrets.PAIRSLASH_RELEASE_TRUST_KEY_ID }}
      PAIRSLASH_RELEASE_TRUST_REQUIRE_SIGNED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release-readiness gates
        run: npm run test:release

  nightly-perf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "24"
            artifact: perf-nightly-linux-node24.json
          - os: windows-latest
            node-version: "24"
            artifact: perf-nightly-windows-node24.json
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Informational only: regressions are review signals, not failures (T9-02).
      - name: Run perf regression suite
        run: npm run test:perf -- --report-out artifacts/${{ matrix.artifact }}

      - name: Upload perf report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  nightly-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Report-only pilot: survivors inform future test hardening, never a
      # gate (T9-03). Scoped to packages/core/memory-engine only.
      - name: Run mutation pilot
        run: node tests/mutation/run-mutation.mjs --report-out artifacts/mutation-memory-engine.json

      - name: Upload mutation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-memory-engine
          path: artifacts/mutation-memory-engine.json
