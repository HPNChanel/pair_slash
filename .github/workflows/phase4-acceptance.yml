name: compat-lab-acceptance

# Deterministic compat-lab lanes only — fake/shim fixtures, no live runtime
# calls. This is deterministic-class evidence; it does not promote runtime
# support lanes (that requires human-captured live records per
# docs/compatibility/runtime-verification.md).
#
# Cost decision (T10-03): the 3-OS x 2-Node matrix runs on every PR except
# plans/-only changes (negative filter below — tests read docs/,
# docs-private/, trust/, .pairslash/, and pack manifests, so an allowlist
# would risk silent coverage loss), and unfiltered on main pushes + manual
# dispatch. The unfiltered repo-checks lane still runs lint/test/typecheck
# on every PR, so nothing escapes the base gate.

on:
  pull_request:
    # Run on every PR except ones that only touch planning docs — the
    # include-everything/exclude-plans shape means new truth surfaces can
    # never silently skip coverage by missing from an allowlist.
    paths:
      - "**"
      - "!plans/**"
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-lab-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            lane: macos
            node-version: "24"
            artifact: compat-lab-acceptance-macos-node24.json
          - os: macos-latest
            lane: macos
            node-version: "26"
            artifact: compat-lab-acceptance-macos-node26.json
          - os: ubuntu-latest
            lane: linux
            node-version: "24"
            artifact: compat-lab-acceptance-linux-node24.json
          - os: ubuntu-latest
            lane: linux
            node-version: "26"
            artifact: compat-lab-acceptance-linux-node26.json
          - os: windows-latest
            lane: windows-prep
            node-version: "24"
            artifact: compat-lab-acceptance-windows-prep-node24.json
          - os: windows-latest
            lane: windows-prep
            node-version: "26"
            artifact: compat-lab-acceptance-windows-prep-node26.json
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test

      - name: Run acceptance lane
        run: npm run test:acceptance -- --lane ${{ matrix.lane }} --report-out artifacts/${{ matrix.artifact }}

      - name: Upload acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
